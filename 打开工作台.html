<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打开高中数学教师 Agent</title>
<style>
  :root{--red:#b20c38;--ink:#253247;--muted:#667084;--line:#e6dde0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(ellipse at 88% 0%,#f1dce4 0,transparent 43%),
      radial-gradient(ellipse at 8% 60%,#dce8ee 0,transparent 42%),#eef1f6;
    color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  main{width:min(520px,100%);padding:36px 32px;background:rgba(255,255,255,.78);
    border:1px solid rgba(255,255,255,.9);border-radius:22px;
    box-shadow:0 16px 48px rgba(48,58,86,.08);backdrop-filter:blur(18px)}
  .eyebrow{font:10px Georgia,serif;letter-spacing:2.5px;color:var(--red)}
  h1{font:600 24px/1.6 "Songti SC","STSong",serif;margin:10px 0 8px}
  p{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 12px}
  .primary{display:inline-block;margin-top:12px;padding:11px 20px;border-radius:12px;
    background:var(--red);color:#fff;text-decoration:none;font-size:13px}
  .primary:hover{background:#8f082b}
  .status{margin-top:16px;padding:10px 12px;border-radius:10px;font-size:12px;
    background:#fff8e8;border:1px solid #e3c56b;color:#6b5317;line-height:1.8}
  .status[hidden]{display:none}
  code{padding:1px 5px;background:#f2ecee;border-radius:4px;font-size:12px}
  .note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;line-height:1.9;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">MATH HOMEWORK AGENT</div>
  <h1>打开高中数学教师 Agent</h1>
  <p>工作台运行在本机 <code>http://127.0.0.1:8765/</code>。如果服务已经启动，下面的按钮会直接打开它。</p>
  <a class="primary" href="http://127.0.0.1:8765/">打开工作台 →</a>
  <div id="status" class="status" hidden>
    <strong>服务还没有启动。</strong><br>
    请先双击项目根目录的 <code>启动工作台.bat</code>（macOS 用 <code>启动工作台.command</code>），
    等浏览器自动打开后，再点上面的按钮。
  </div>
  <div class="note">
    不要直接双击 <code>app/static/index.html</code>：那只是界面文件，没有本地服务，保存练习和调用模型都会失败。
  </div>
</main>
<script>
(() => {
  const target = 'http://127.0.0.1:8765/';
  const status = document.getElementById('status');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 2500);
  fetch(target + 'api/health', {mode: 'no-cors', cache: 'no-store', signal: controller.signal})
    .then(() => { clearTimeout(timer); location.replace(target); })
    .catch(() => { clearTimeout(timer); status.hidden = false; });
})();
</script>
</body>
</html>
